[project]
name = "edge-lab"
version = "0.1.0"
description = "Cross-venue research on Hyperliquid + dYdX v4 data: unified mids, basis, lead-lag"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.18.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.3.0",
    "plotly>=5.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
